
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>My DnD P2P Dashboard</title>
</head>
<body class="bg-gray-50 flex flex-col">
  <div class="flex items-center justify-between p-4 bg-white shadow space-x-2">
    <span class="font-semibold">My DnD P2P Dashboard</span>
    <span id="status-indicator" class="w-3 h-3 rounded-full bg-red-500"></span>
  </div>
  <div class="flex items-center space-x-2 p-4 bg-white shadow">
    <input id="peer-id" class="hidden px-2 py-1 border rounded w-1/3" placeholder="Votre Peer ID" readonly />
    <button id="copy-peer-id" class="px-2 py-1 bg-blue-500 text-white rounded">Copier ID</button>
    <input id="their-peer-id" class="hidden px-2 py-1 border rounded w-1/3" placeholder="Peer ID à joindre" />
    <button id="paste-peer-id" class="px-4 py-2 bg-blue-500 text-white rounded">Coller ID</button>
    <button id="peer-connect" class="px-4 py-2 bg-gray-500 text-white rounded">Connecter</button>
  </div>
  <div
    id="app"
    class="flex-1 grid grid-cols-1 md:grid-cols-3 grid-rows-auto md:grid-rows-1 gap-4 p-4 min-h-0 overflow-hidden"
  ></div>
  <!-- PeerJS from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
